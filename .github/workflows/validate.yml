name: Validation

on:
    - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - name: Set Up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.x'
            cache: 'pip'
        - name: Install Dependencies
          run: python -m pip install --upgrade pip && pip install -r app/requirements.txt && pip install ruff pytest
        - name: Lint Python Code
          run: ruff check app --output-format=github
        - name: Check Code Format
          run: ruff format --diff app 
        - name: Test Code
          run: pytest --rootdir app --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html